<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材図・忠実カラー化ツール</title>
<style>
:root{--blue:#1769e0;--green:#258a48;--red:#d93025;--line:#cfd8e3;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Meiryo",sans-serif;background:var(--bg);color:#172033}header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#5d6675;font-size:14px}main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;min-height:calc(100vh - 78px)}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 2px 8px #0000000d}label{font-weight:700;font-size:14px}input[type=file]{width:100%;margin:8px 0 10px}.row{display:grid;grid-template-columns:105px 1fr 46px;gap:8px;align-items:center;margin:8px 0}input[type=range]{width:100%}button{border:0;border-radius:8px;padding:9px 11px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.gray{background:#e9edf3;color:#1d2735}.red{background:var(--red);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.help,.notice{font-size:13px;line-height:1.6;padding:10px;border-radius:8px}.help{background:#f6f8fa;color:#52606f}.notice{background:#fff7d6;color:#604600;margin-top:10px}.tabs{display:flex;gap:6px;margin:10px 0}.tab{flex:1}.tab.on{background:var(--blue);color:#fff}#workspace{overflow:auto}.stage{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.view h3{font-size:14px;margin:0 0 6px}.canvasBox{background:#ddd;border:1px solid var(--line);overflow:auto;max-height:75vh}canvas{display:block;max-width:100%;height:auto;background:#fff}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:7px 0}.swatch{height:34px;border-radius:7px;border:2px solid #fff;outline:1px solid #aeb8c5}.swatch.active{outline:3px solid var(--blue)}.toolrow{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.small{font-size:12px;color:#697386}@media(max-width:950px){main{grid-template-columns:1fr}.stage{grid-template-columns:1fr}}
</style></head><body>
<header><h1>教材図・忠実カラー化ツール</h1><p>原図の座標・線・文字・指示線を動かさず、明るさ調整と手動着色だけを行います。</p></header>
<main><section class="panel">
<label>1. 原図を読み込む</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<div class="help"><b>このツールが守ること</b><br>・画像サイズと全要素の座標を変更しません。<br>・地図、指示線、矢印、四角、文字を描き直しません。<br>・元画像の画素に対して、明るさ・白背景化・色付けのみを行います。</div>
<div class="tabs"><button id="autoTab" class="tab on">自動補正</button><button id="paintTab" class="tab gray">部分着色</button></div>
<div id="autoPanel">
<div class="row"><label>明るさ</label><input id="brightness" type="range" min="70" max="160" value="112"><span id="brightnessV">112</span></div>
<div class="row"><label>コントラスト</label><input id="contrast" type="range" min="70" max="180" value="118"><span id="contrastV">118</span></div>
<div class="row"><label>彩度</label><input id="saturation" type="range" min="0" max="180" value="108"><span id="saturationV">108</span></div>
<div class="row"><label>白背景化</label><input id="whiteLevel" type="range" min="0" max="100" value="45"><span id="whiteLevelV">45</span></div>
<div class="row"><label>線の強調</label><input id="inkLevel" type="range" min="0" max="100" value="18"><span id="inkLevelV">18</span></div>
<div class="toolrow"><button id="presetDoc" class="gray">白黒原図向け</button><button id="presetColor" class="gray">カラー原図向け</button><button id="reset" class="gray">初期値</button></div>
</div>
<div id="paintPanel" style="display:none"><div class="small">原図上をなぞって色を重ねます。線や形は移動しません。</div><div class="swatches" id="swatches"><button class="swatch active" style="background: rgb(143, 211, 255);"></button><button class="swatch" style="background: rgb(168, 230, 163);"></button><button class="swatch" style="background: rgb(255, 224, 138);"></button><button class="swatch" style="background: rgb(255, 179, 179);"></button><button class="swatch" style="background: rgb(215, 182, 255);"></button><button class="swatch" style="background: rgb(255, 196, 138);"></button><button class="swatch" style="background: rgb(183, 236, 236);"></button><button class="swatch" style="background: rgb(230, 214, 184);"></button><button class="swatch" style="background: rgb(245, 167, 208);"></button><button class="swatch" style="background: rgb(255, 255, 255);"></button></div>
<div class="row"><label>筆の太さ</label><input id="brushSize" type="range" min="4" max="100" value="28"><span id="brushSizeV">28</span></div>
<div class="row"><label>色の濃さ</label><input id="opacity" type="range" min="5" max="70" value="28"><span id="opacityV">28</span></div>
<div class="toolrow"><button id="brush" class="primary">筆</button><button id="eraser" class="gray">消しゴム</button><button id="undo" class="gray">1つ戻す</button><button id="clearPaint" class="red">着色を消す</button></div></div>
<div class="toolrow" style="margin-top:14px"><button id="saveOriginal" class="green" disabled="">原図を保存</button><button id="saveResult" class="primary" disabled="">説明図を保存</button></div>
<div class="notice">完全な「描き直し」ではなく、原図を画素単位で保持する方式です。そのため、線の着地点や文字配置がずれません。</div>
</section>
<section id="workspace" class="panel"><div id="empty">左側から原図を読み込んでください。</div><div id="stage" class="stage" style="display:none"><div class="view"><h3>原図</h3><div class="canvasBox"><canvas id="source"></canvas></div></div><div class="view"><h3>説明図（補正後）</h3><div class="canvasBox"><canvas id="result"></canvas></div></div></div></section></main>
<script>
const $=id=>document.getElementById(id),file=$('file'),source=$('source'),result=$('result'),sctx=source.getContext('2d',{willReadFrequently:true}),rctx=result.getContext('2d',{willReadFrequently:true}),stage=$('stage'),empty=$('empty');let img=new Image(),originalName='教材図',baseData=null,paintCanvas=document.createElement('canvas'),pctx=paintCanvas.getContext('2d'),drawing=false,last=null,tool='brush',history=[],selectedColor='#8fd3ff';
['brightness','contrast','saturation','whiteLevel','inkLevel','brushSize','opacity'].forEach(id=>{const el=$(id),v=$(id+'V');el.oninput=()=>{v.textContent=el.value;if(['brightness','contrast','saturation','whiteLevel','inkLevel'].includes(id))render()}});
file.onchange=e=>{const f=e.target.files[0];if(!f)return;originalName=f.name.replace(/\.[^.]+$/,'');const u=URL.createObjectURL(f);img.onload=()=>{source.width=result.width=paintCanvas.width=img.naturalWidth;source.height=result.height=paintCanvas.height=img.naturalHeight;sctx.drawImage(img,0,0);baseData=sctx.getImageData(0,0,source.width,source.height);pctx.clearRect(0,0,paintCanvas.width,paintCanvas.height);history=[];stage.style.display='grid';empty.style.display='none';$('saveOriginal').disabled=$('saveResult').disabled=false;render();URL.revokeObjectURL(u)};img.src=u};
const clamp=v=>Math.max(0,Math.min(255,v));
function render(){if(!baseData)return;const b=+$('brightness').value/100,c=+$('contrast').value/100,s=+$('saturation').value/100,wv=+$('whiteLevel').value/100,ink=+$('inkLevel').value/100,out=new ImageData(new Uint8ClampedArray(baseData.data),baseData.width,baseData.height),d=out.data;for(let i=0;i<d.length;i+=4){let R=d[i],G=d[i+1],B=d[i+2],L=.299*R+.587*G+.114*B;R=L+(R-L)*s;G=L+(G-L)*s;B=L+(B-L)*s;R=((R-128)*c+128)*b;G=((G-128)*c+128)*b;B=((B-128)*c+128)*b;L=.299*R+.587*G+.114*B;const w=Math.max(0,(L-175)/80)*wv;R+= (255-R)*w;G+=(255-G)*w;B+=(255-B)*w;const k=Math.max(0,(135-L)/135)*ink;d[i]=clamp(R*(1-k));d[i+1]=clamp(G*(1-k));d[i+2]=clamp(B*(1-k))}rctx.putImageData(out,0,0);rctx.save();rctx.globalCompositeOperation='multiply';rctx.drawImage(paintCanvas,0,0);rctx.restore()}
function setVals(o){for(const[k,v]of Object.entries(o)){$(k).value=v;$(k+'V').textContent=v}render()}
$('presetDoc').onclick=()=>setVals({brightness:118,contrast:132,saturation:75,whiteLevel:68,inkLevel:28});$('presetColor').onclick=()=>setVals({brightness:108,contrast:112,saturation:118,whiteLevel:24,inkLevel:10});$('reset').onclick=()=>setVals({brightness:112,contrast:118,saturation:108,whiteLevel:45,inkLevel:18});
$('autoTab').onclick=()=>{$('autoPanel').style.display='block';$('paintPanel').style.display='none';$('autoTab').className='tab on';$('paintTab').className='tab gray'};$('paintTab').onclick=()=>{$('autoPanel').style.display='none';$('paintPanel').style.display='block';$('paintTab').className='tab on';$('autoTab').className='tab gray'};
['#8fd3ff','#a8e6a3','#ffe08a','#ffb3b3','#d7b6ff','#ffc48a','#b7ecec','#e6d6b8','#f5a7d0','#ffffff'].forEach((col,i)=>{const b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.style.background=col;b.onclick=()=>{selectedColor=col;[...$('swatches').children].forEach(x=>x.classList.remove('active'));b.classList.add('active')};$('swatches').appendChild(b)});
function point(e){const r=result.getBoundingClientRect();return{x:(e.clientX-r.left)*result.width/r.width,y:(e.clientY-r.top)*result.height/r.height}}
function snapshot(){history.push(pctx.getImageData(0,0,paintCanvas.width,paintCanvas.height));if(history.length>20)history.shift()}
result.onpointerdown=e=>{if($('paintPanel').style.display==='none')return;snapshot();drawing=true;last=point(e);result.setPointerCapture(e.pointerId)};result.onpointermove=e=>{if(!drawing)return;const q=point(e);pctx.save();pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=+$('brushSize').value;if(tool==='eraser'){pctx.globalCompositeOperation='destination-out';pctx.strokeStyle='#000';pctx.globalAlpha=1}else{pctx.globalCompositeOperation='source-over';pctx.strokeStyle=selectedColor;pctx.globalAlpha=+$('opacity').value/100}pctx.beginPath();pctx.moveTo(last.x,last.y);pctx.lineTo(q.x,q.y);pctx.stroke();pctx.restore();last=q;render()};result.onpointerup=()=>{drawing=false;last=null};
$('brush').onclick=()=>{tool='brush';$('brush').className='primary';$('eraser').className='gray'};$('eraser').onclick=()=>{tool='eraser';$('eraser').className='primary';$('brush').className='gray'};$('undo').onclick=()=>{if(history.length){pctx.putImageData(history.pop(),0,0);render()}};$('clearPaint').onclick=()=>{if(confirm('部分着色をすべて消しますか？')){snapshot();pctx.clearRect(0,0,paintCanvas.width,paintCanvas.height);render()}};
function save(c,n){c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}$('saveOriginal').onclick=()=>save(source,originalName+'_原図.png');$('saveResult').onclick=()=>save(result,originalName+'_説明図.png');
</script></body></html>
